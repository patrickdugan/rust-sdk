[package]
name = "rmcp-flowmesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Opt-in budget-aware MCP execution with scoped compact evidence"

[dependencies]
rmcp = { workspace = true, features = ["client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
